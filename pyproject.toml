[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backtest-audit"
version = "0.1.0"
description = "Statistical overfitting audit tools for algorithmic trading backtests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["backtest", "overfitting", "sharpe", "trading", "finance", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-anyio>=0.0.0",
    "anyio>=4.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["UP006", "UP007", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
